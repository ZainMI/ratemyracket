services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api

    container_name: ratemyracket-api

    restart: unless-stopped

    env_file:
      - .env.api

    expose:
      - "8080"

    networks:
      - ratemyracket

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ratemyracket:
    name: ratemyracket
